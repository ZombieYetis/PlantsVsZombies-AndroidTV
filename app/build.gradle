plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    Runtime.getRuntime().exec(new String[]{
            "keytool", "-genkeypair",
            "-v", "-keystore", "${System.getProperty("user.home")}/debug.keystore",
            "-storepass", "android",
            "-keypass", "android",
            "-alias", "androiddebugkey",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-validity", "10000",
            "-dname", "CN=Android Debug,O=Android,C=US"
    }).waitFor()
}

android {
    namespace = "com.trans.pvztv"
    ndkVersion = "27.3.13750724"
    compileSdk = 35

    defaultConfig {
        def gitBranch = "git rev-parse --abbrev-ref HEAD".execute().text.trim()
        def gitCommitDate = "git log --date=format:%y%m%d --pretty=format:%cd -1".execute().text.trim()
        def gitCommitHash = "git rev-parse --short HEAD".execute().text.trim()
        def gitCommitNum = "git rev-list --count HEAD".execute().text.trim()
        def gitRepoUrl = "git config --get remote.origin.url".execute().text.trim()

        applicationId = "com.trans.pvztv"
        minSdk = 21
        targetSdk = 35
        versionCode = 2
        versionName = "0.0.0"
        versionNameSuffix = "-" + gitCommitDate

        ndk {
            abiFilters "armeabi-v7a"
        }

        buildConfigField("String", "GIT_BRANCH", "\"${gitBranch}\"")
        buildConfigField("String", "GIT_COMMIT_HASH", "\"${gitCommitHash}\"")
        buildConfigField("int", "GIT_COMMIT_NUM", gitCommitNum)
        buildConfigField("String", "GIT_REPO_URL", "\"${gitRepoUrl}\"")
    }

    signingConfigs {
        // 本文件已被 git 跟踪, 不要在此处修改签名配置, 需要自定义签名配置请参考 README.md
        release {
            keyAlias = keystoreProperties.getProperty("keyAlias", "androiddebugkey")
            keyPassword = keystoreProperties.getProperty("keyPassword", "android")
            storeFile = file(keystoreProperties.getProperty("storeFile", "${System.getProperty("user.home")}/debug.keystore"))
            storePassword = keystoreProperties.getProperty("storePassword", "android")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
        }

        relWithDebInfo {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.debug
            debuggable = true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }

        release {
            signingConfig = signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            /* TODO: Use `@Keep` and uncomment below */
            // minifyEnabled = true
            // shrinkResources = true
        }
    }

    flavorDimensions += "version"

    productFlavors {
        // w 代替 v 以降低默认优先级
        register("w111") {
            dimension = "version"
            applicationId = "com.trans.pvz"
            versionName = "1.1.1"
            externalNativeBuild {
                cmake {
                    arguments "-DPVZ_VERSION=111"
                }
            }
        }

        register("v115") {
            dimension = "version"
            versionName = "1.1.5"
            externalNativeBuild {
                cmake {
                    arguments "-DPVZ_VERSION=115"
                }
            }
        }
    }

    compileOptions {
        // Java 8 for compatibility of low APL level
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "PvZ-TV-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

java {
    toolchain {
        // Java toolchain version under 21 for source/target version 8
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation fileTree("dir": "libs", "include": ["*.jar"])
    implementation 'androidx.annotation:annotation:1.9.1'
}
