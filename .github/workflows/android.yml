name: Android CI

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ w111, v115 ]
        build_type: [ release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout assets
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          path: app/src/main/assets
          token: ${{ secrets.ASSETS_TOKEN }}
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Decode keystore
        if: matrix.build_type == 'release'
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_ENCODED" ]; then
            echo "$KEYSTORE_ENCODED" | base64 -d > app/keystore.jks
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          fi

      - name: Build with Gradle
        id: build
        run: |
          version="${{ matrix.version }}"
          build_type="${{ matrix.build_type }}"
          chmod +x gradlew
          ./gradlew assemble${version^}${build_type^}
          echo "path=app/build/outputs/apk/$version/$build_type/*.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PvZ-TV-${{ matrix.version }}-${{ matrix.build_type }}
          path: ${{ steps.build.outputs.path }}

  release:
    needs: [ build ]
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'ZombieYetis'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit information
        id: commit_info
        run: |
          echo "commits_date=$(git log --date=format:%y%m%d --pretty=format:'%cd' -1)" >> "$GITHUB_OUTPUT"
          echo "commits_count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --pretty=format:'%s' -1)" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: PvZ-TV-v115-release
          path: artifact

      - name: Publish pre-release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: nightly
          title: Nightly Build
          files: artifact/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ github.repository_owner }}/PvZ-TV-builds
          token: ${{ secrets.BUILDS_TOKEN }}
          prerelease: false
          make_latest: true
          tag_name: ${{ steps.commit_info.outputs.commits_date }}-${{ steps.commit_info.outputs.commits_count }}
          body: ${{ steps.commit_info.outputs.commit_msg }} (${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: artifact/*.apk
