name: Android CI

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ w111, v115 ]
        build_type: [ release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout assets
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          path: app/src/main/assets
          token: ${{ secrets.ASSETS_TOKEN }}
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
          add-job-summary: on-failure

      - name: Decode keystore
        if: matrix.build_type == 'release'
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_ENCODED" ]; then
            echo "$KEYSTORE_ENCODED" | base64 -d > app/keystore.jks
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          fi

      - name: Build with Gradle
        id: build
        run: |
          VERSION="${{ matrix.version }}"
          BUILD_TYPE="${{ matrix.build_type }}"
          chmod +x gradlew
          ./gradlew assemble${VERSION^}${BUILD_TYPE^}
          echo "path=app/build/outputs/apk/$VERSION/$BUILD_TYPE/*.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PvZ-TV-${{ matrix.version }}-${{ matrix.build_type }}
          path: ${{ steps.build.outputs.path }}

      - name: Publish pre-release
        uses: marvinpinto/action-automatic-releases@latest
        if: >
          github.ref == 'refs/heads/dev' &&
          github.repository_owner == 'ZombieYetis' &&
          matrix.version == 'v115' &&
          matrix.build_type == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: nightly
          title: Nightly Build
          files: ${{ steps.build.outputs.path }}

  release:
    needs: [ build ]
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'ZombieYetis'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set build variables
        id: build_vars
        run: |
          echo "date=$(git log --date=format:%y%m%d --pretty=format:'%cd' -n 1)" >> "$GITHUB_OUTPUT"
          echo "commits_count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: PvZ-TV-v115-release
          path: artifact

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ github.repository_owner }}/PvZ-TV-builds
          token: ${{ secrets.BUILDS_TOKEN }}
          prerelease: false
          make_latest: true
          tag_name: ${{ steps.build_vars.outputs.date }}-${{ steps.build_vars.outputs.commits_count }}
          body: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          files: artifact/*.apk
